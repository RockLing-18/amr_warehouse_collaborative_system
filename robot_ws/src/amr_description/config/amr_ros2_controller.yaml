# ============================================================
# 控制器参数模板（控制算法参数）
# 几何/关节参数由 config/amr_v1.yaml 提供，生成脚本加载本模板后
# 覆盖注入以下字段：
#   amr_effort_controller.joints
#   amr_diff_drive_controller.left_wheel_names / right_wheel_names
#   amr_diff_drive_controller.wheel_radius / wheel_separation
#   amr_diff_drive_controller.odom_frame_id / base_frame_id
# 本文件不直接维护机器人几何参数。
# ============================================================
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true
    amr_robot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      use_sim_time: true
    amr_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


amr_diff_drive_controller:
  ros__parameters:
    publish_rate: 50.0
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]
    open_loop: true
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
