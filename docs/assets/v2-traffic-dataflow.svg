<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" width="1400" height="790" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" role="img">
<title>V2 交通路权数据链路与进程边界</title>
<desc>从左到右：amr_navigation / Nav2 提供 action feedback 位姿（V0.20 起不再订阅 plan），amr_behavior_manager 内的 TrafficGate 用 4 点通行控制区的中心点进出边沿做判定与决策并直接调用 NavigationClient 取消导航，amr_agent 的 TrafficBridge 只做 MQTT 透明桥，Edge 侧 traffic_rights_service 与 ResourceBroker 持有全局 lease 与 FIFO 队列。实线为 V1 已实现，橙色虚线为 V2 新增。</desc>
<rect x="0" y="0" width="1400" height="790" fill="#FFFFFF"/>
<defs>
  <marker id="aBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#185FA5" stroke-width="1.5"/></marker>
  <marker id="aGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
  <marker id="aOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#B26A00" stroke-width="1.5"/></marker>
</defs>

<text x="40" y="42" font-size="22" font-weight="500" fill="#1F2328">V2 交通路权 · 进程边界与数据链路</text>
<text x="40" y="68" font-size="13" fill="#57606A">配 docs/architecture/roadmap/v2-traffic-control-chain.md §4 · J 编号与逐跳表一一对应 · 相对 topic 由 namespace 解析为 /{robot_id}/...</text>
<rect x="1090" y="26" width="18" height="12" fill="#E6F1FB" stroke="#B5D4F4"/>
<text x="1114" y="36" font-size="11" fill="#57606A">V1 已实现</text>
<rect x="1200" y="26" width="18" height="12" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="1224" y="36" font-size="11" fill="#57606A">V2 新增（含补空壳）</text>

<!-- ============ AMR 层 ============ -->
<rect x="40" y="96" width="815" height="566" rx="10" fill="#F3F8FD" stroke="#B5D4F4"/>
<text x="58" y="122" font-size="15" font-weight="500" fill="#0C447C">AMR 层 · namespace = {robot_id}</text>
<text x="290" y="122" font-size="12" fill="#57606A">三个进程 · 数据流自左向右 · 无环、无第二套 MQTT 客户端</text>

<!-- 进程 A：amr_navigation / Nav2 -->
<rect x="58" y="142" width="242" height="356" rx="8" fill="#FFFFFF" stroke="#B5D4F4"/>
<text x="72" y="168" font-size="13" font-weight="500" fill="#0C447C">amr_navigation / Nav2</text>
<text x="72" y="186" font-size="10.5" fill="#57606A">V1 已有 · 不新增 ROS2 导航接口</text>
<rect x="72" y="200" width="214" height="62" rx="6" fill="#E6F1FB" stroke="#B5D4F4"/>
<text x="82" y="220" font-size="11.5" font-weight="500" fill="#185FA5">amr_navigate_to_pose</text>
<text x="82" y="238" font-size="10.5" fill="#57606A">action · feedback.current_pose (J2)</text>
<text x="82" y="254" font-size="10.5" fill="#B26A00">上层 feedback 回调为空 → 须填实</text>
<rect x="72" y="272" width="214" height="56" rx="6" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="82" y="292" font-size="11.5" font-weight="500" fill="#8A5A00">无 plan 订阅（J1 移除）</text>
<text x="82" y="310" font-size="10.5" fill="#57606A">V0.20：拉长 L_pull 自带提前量</text>
<rect x="72" y="338" width="214" height="50" rx="6" fill="#E6F1FB" stroke="#B5D4F4"/>
<text x="82" y="358" font-size="11.5" font-weight="500" fill="#185FA5">robot_pose（1 Hz）</text>
<text x="82" y="376" font-size="10.5" fill="#57606A">禁止用作进出判据主数据源</text>
<rect x="72" y="398" width="214" height="86" rx="6" fill="#FFF1F0" stroke="#E0A0A0"/>
<text x="82" y="418" font-size="11.5" font-weight="500" fill="#A33A3A">前置阻塞：4 个导航缺陷</text>
<text x="82" y="436" font-size="10.5" fill="#57606A">supersede / 60s 超时不 cancel /</text>
<text x="82" y="452" font-size="10.5" fill="#57606A">m_nav_epoch 竞态 / accepted 语义</text>
<text x="82" y="470" font-size="10.5" fill="#A33A3A">先修，再接路权</text>

<!-- 进程 B：amr_behavior_manager -->
<rect x="320" y="142" width="278" height="356" rx="8" fill="#FFFFFF" stroke="#B5D4F4"/>
<text x="334" y="168" font-size="13" font-weight="500" fill="#0C447C">amr_behavior_manager</text>
<text x="334" y="186" font-size="10.5" fill="#57606A">单趟编排 · 路权决策在此进程内</text>
<rect x="334" y="200" width="250" height="60" rx="6" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="344" y="220" font-size="11.5" font-weight="500" fill="#8A5A00">TrafficGate（内嵌，无独立模块）</text>
<text x="344" y="238" font-size="10.5" fill="#57606A">point_in_poly(center) 边沿 + 滞回 · 决策</text>
<text x="344" y="254" font-size="10.5" fill="#57606A">四触发取最早 · 不改 task_state</text>
<rect x="334" y="270" width="250" height="56" rx="6" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="344" y="290" font-size="11" font-weight="500" fill="#8A5A00">BT 节点（TBD-023）</text>
<text x="344" y="307" font-size="10.5" fill="#57606A">RequestOnApproach / WaitAndRetry</text>
<text x="344" y="322" font-size="10.5" fill="#57606A">ReleaseTrafficRight</text>
<rect x="334" y="336" width="250" height="54" rx="6" fill="#E6F1FB" stroke="#B5D4F4"/>
<text x="344" y="356" font-size="11.5" font-weight="500" fill="#185FA5">NavigationClient（已有，直接复用）</text>
<text x="344" y="374" font-size="10.5" fill="#57606A">J10 cancelNavigation() / J11 navigateToPose()</text>
<rect x="334" y="400" width="250" height="84" rx="6" fill="#E6F1FB" stroke="#B5D4F4"/>
<text x="344" y="420" font-size="11.5" font-weight="500" fill="#185FA5">traffic_gate_loader（TBD-039）</text>
<text x="344" y="438" font-size="10.5" fill="#57606A">traffic_gates.yaml：4 点凸 polygon</text>
<text x="344" y="456" font-size="10.5" fill="#57606A">wait_poses{l1,l2}，入口端边外侧</text>
<text x="344" y="474" font-size="10.5" fill="#57606A">entry_side 锁存 · 同侧组内就近</text>

<!-- 进程 C：amr_agent -->
<rect x="618" y="142" width="222" height="356" rx="8" fill="#FFFFFF" stroke="#B5D4F4"/>
<text x="632" y="168" font-size="13" font-weight="500" fill="#0C447C">amr_agent</text>
<text x="632" y="186" font-size="10.5" fill="#57606A">唯一 MQTT 网关 · 只做透明桥</text>
<rect x="632" y="200" width="194" height="76" rx="6" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="642" y="220" font-size="11.5" font-weight="500" fill="#8A5A00">TrafficBridge（V2 补空壳）</text>
<text x="642" y="238" font-size="10.5" fill="#57606A">不判几何 · 不碰位姿</text>
<text x="642" y="254" font-size="10.5" fill="#57606A">不调导航 · 不做业务决策</text>
<text x="642" y="270" font-size="10.5" fill="#57606A">V1 已有前向声明 + 成员指针</text>
<rect x="632" y="286" width="194" height="70" rx="6" fill="#E6F1FB" stroke="#B5D4F4"/>
<text x="642" y="306" font-size="11.5" font-weight="500" fill="#185FA5">TaskBridge（照抄范式）</text>
<text x="642" y="324" font-size="10.5" fill="#57606A">registerExternalHandler()</text>
<text x="642" y="340" font-size="10.5" fill="#57606A">setExternalSubscribe()</text>
<rect x="632" y="366" width="194" height="60" rx="6" fill="#F7F7F5" stroke="#B4B2A9"/>
<text x="642" y="386" font-size="11" font-weight="500" fill="#444441">红线</text>
<text x="642" y="404" font-size="10.5" fill="#57606A">不新增 MQTT client</text>
<text x="642" y="420" font-size="10.5" fill="#57606A">不改 TaskCommand / TaskEvent</text>
<rect x="632" y="436" width="194" height="48" rx="6" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="642" y="456" font-size="10.5" font-weight="500" fill="#8A5A00">traffic_request (J4)</text>
<text x="642" y="472" font-size="10.5" font-weight="500" fill="#8A5A00">traffic_response (J9)</text>

<!-- AMR 内部箭头 -->
<line x1="300" y1="240" x2="318" y2="240" stroke="#185FA5" stroke-width="1.5" marker-end="url(#aBlue)"/>
<text x="302" y="230" font-size="10" fill="#185FA5">J2</text>
<line x1="598" y1="228" x2="616" y2="228" stroke="#B26A00" stroke-width="1.5" marker-end="url(#aOrange)"/>
<text x="598" y="218" font-size="10" fill="#B26A00">J4</text>
<line x1="618" y1="268" x2="600" y2="268" stroke="#B26A00" stroke-width="1.5" marker-end="url(#aOrange)"/>
<text x="600" y="284" font-size="10" fill="#B26A00">J9</text>

<!-- AMR 底部控制链 -->
<rect x="58" y="512" width="782" height="132" rx="8" fill="#FFFFFF" stroke="#B5D4F4"/>
<text x="72" y="536" font-size="13" font-weight="500" fill="#0C447C">B 进程内控制链 · 关键：取消导航不需要任何跨进程接口</text>
<text x="72" y="558" font-size="11" fill="#185FA5">GRANTED（正常路径）→ 零动作：不减速、不 cancel、不重发 goal，车继续 NavigateToPose(D)</text>
<text x="72" y="578" font-size="11" fill="#8A5A00">REJECTED（异常路径）→ J10 cancelNavigation() → 等 result 回调 m_goal_active=false → J11 navigateToPose(等待点)</text>
<text x="72" y="598" font-size="11" fill="#57606A">　→ WAITING（Nav2 无活动 goal、cmd_vel 归零）→ 固定 T_retry=10s 同 request_id 幂等重发 → 收到 response 立即 navigateToPose(D)</text>
<text x="72" y="618" font-size="11" fill="#0F6E56">释放 → 出区边沿 / 任务结束 / lease_ttl 到期 / 显式 CANCEL，四触发取最早；改道由出区或 TTL 承接</text>

<!-- ============ MQTT 带 ============ -->
<rect x="870" y="96" width="180" height="566" rx="10" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="884" y="122" font-size="14" font-weight="500" fill="#085041">MQTT · QoS 1</text>
<text x="884" y="140" font-size="10.5" fill="#0F6E56">Edge-side EMQX</text>
<rect x="884" y="196" width="152" height="82" rx="6" fill="#FFFFFF" stroke="#5DCAA5"/>
<text x="894" y="216" font-size="11" font-weight="500" fill="#0F6E56">上行 AMR → Edge</text>
<text x="894" y="234" font-size="10" fill="#57606A">amr/{id}/traffic_rights/</text>
<text x="894" y="250" font-size="10" fill="#57606A">request（payload op）</text>
<text x="894" y="268" font-size="10" fill="#57606A">J5 · op 三态 · 幂等</text>
<rect x="884" y="292" width="152" height="82" rx="6" fill="#FFFFFF" stroke="#5DCAA5"/>
<text x="894" y="312" font-size="11" font-weight="500" fill="#0F6E56">下行 Edge → AMR</text>
<text x="894" y="330" font-size="10" fill="#57606A">amr/{id}/traffic_rights/</text>
<text x="894" y="346" font-size="10" fill="#57606A">response（单播）</text>
<text x="894" y="364" font-size="10" fill="#57606A">J8 · 不广播</text>
<rect x="884" y="388" width="152" height="62" rx="6" fill="#FFFFFF" stroke="#5DCAA5"/>
<text x="894" y="408" font-size="11" font-weight="500" fill="#0F6E56">Edge 通配订阅 J6</text>
<text x="894" y="426" font-size="10" fill="#57606A">amr/+/traffic_rights/request</text>
<text x="894" y="442" font-size="10" fill="#57606A">新增机器人零配置</text>
<text x="884" y="480" font-size="10.5" fill="#0F6E56">通配只解决「接得到」，</text>
<text x="884" y="496" font-size="10.5" fill="#0F6E56">动作语义由 payload op 承载</text>
<text x="884" y="512" font-size="10.5" fill="#0F6E56">REQUEST / CANCEL / RELEASE</text>
<text x="884" y="528" font-size="10.5" fill="#0F6E56">（INV-14 已定案）</text>
<text x="884" y="560" font-size="10.5" fill="#57606A">V1 现状：仅 2 个字符串</text>
<text x="884" y="576" font-size="10.5" fill="#57606A">常量，handler 订阅整段</text>
<text x="884" y="592" font-size="10.5" fill="#57606A">被注释，response 无订阅</text>

<!-- MQTT 侧箭头 -->
<line x1="840" y1="228" x2="868" y2="228" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#aGreen)"/>
<text x="844" y="218" font-size="10" fill="#0F6E56">J5</text>
<line x1="870" y1="268" x2="842" y2="268" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#aGreen)"/>
<text x="844" y="284" font-size="10" fill="#0F6E56">J9</text>

<!-- ============ Edge 层 ============ -->
<rect x="1066" y="96" width="294" height="566" rx="10" fill="#EEEDFE" stroke="#AFA9EC"/>
<text x="1080" y="122" font-size="14" font-weight="500" fill="#3C3489">Edge 层 · 唯一全局 lease 视图</text>
<text x="1080" y="140" font-size="10.5" fill="#534AB7">共享资源中心仲裁 · 不感知 Nav2</text>
<rect x="1080" y="158" width="266" height="64" rx="6" fill="#FFFFFF" stroke="#CECBF6"/>
<text x="1090" y="178" font-size="11.5" font-weight="500" fill="#3C3489">AmrCommunication</text>
<text x="1090" y="196" font-size="10.5" fill="#57606A">通配订阅 · payload op 已定案</text>
<text x="1090" y="212" font-size="10.5" fill="#57606A">robot_id 与 topic 交叉校验</text>
<rect x="1080" y="232" width="266" height="60" rx="6" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="1090" y="252" font-size="11.5" font-weight="500" fill="#8A5A00">traffic_rights_service（V2 新增）</text>
<text x="1090" y="270" font-size="10.5" fill="#57606A">request_id 幂等 · epoch 防陈旧</text>
<text x="1090" y="286" font-size="10.5" fill="#57606A">显式 cancel 两态语义</text>
<rect x="1080" y="302" width="266" height="64" rx="6" fill="#FFF4E5" stroke="#E0A458" stroke-dasharray="4 3"/>
<text x="1090" y="322" font-size="11.5" font-weight="500" fill="#8A5A00">ResourceBroker（V2 新增）</text>
<text x="1090" y="340" font-size="10.5" fill="#57606A">FIFO queue_seq · 原子授权</text>
<text x="1090" y="356" font-size="10.5" fill="#57606A">J13 lease_ttl 到期自动回收</text>
<rect x="1080" y="376" width="266" height="56" rx="6" fill="#FFFFFF" stroke="#CECBF6"/>
<text x="1090" y="396" font-size="11.5" font-weight="500" fill="#3C3489">SQLite tbl_resource_lease</text>
<text x="1090" y="414" font-size="10.5" fill="#57606A">PENDING 不进部分唯一索引</text>
<text x="1090" y="428" font-size="10.5" fill="#57606A">重启可重建占用状态</text>
<rect x="1080" y="442" width="266" height="82" rx="6" fill="#F7F7F5" stroke="#B4B2A9"/>
<text x="1090" y="462" font-size="11" font-weight="500" fill="#444441">lease 状态机</text>
<text x="1090" y="480" font-size="10.5" fill="#57606A">PENDING → GRANTED → HELD</text>
<text x="1090" y="496" font-size="10.5" fill="#57606A">→ RELEASED</text>
<text x="1090" y="512" font-size="10.5" fill="#57606A">EXPIRED / CANCELLED / REVOKED</text>
<rect x="1080" y="534" width="266" height="106" rx="6" fill="#E1F5EE" stroke="#5DCAA5"/>
<text x="1090" y="554" font-size="11" font-weight="500" fill="#085041">「怎么知道 AMR 取消了」的答案</text>
<text x="1090" y="572" font-size="10.5" fill="#0F6E56">快路径：显式 cancel（PENDING 出队 /</text>
<text x="1090" y="588" font-size="10.5" fill="#0F6E56">已授权则释放 lease + 配额回退）</text>
<text x="1090" y="604" font-size="10.5" fill="#0F6E56">安全网：TTL 到期自动回收</text>
<text x="1090" y="622" font-size="10.5" fill="#0F6E56">Edge 不必可靠「知道」也能不占死</text>

<!-- Edge 侧箭头 -->
<line x1="1050" y1="228" x2="1064" y2="228" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#aGreen)"/>
<text x="1034" y="218" font-size="10" fill="#0F6E56">J6</text>
<line x1="1066" y1="268" x2="1052" y2="268" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#aGreen)"/>
<text x="1050" y="284" font-size="10" fill="#0F6E56">J8</text>

<!-- ============ 底部红线 ============ -->
<text x="40" y="692" font-size="13" font-weight="500" fill="#1F2328">三条红线（做错即返工）</text>
<text x="40" y="714" font-size="11.5" fill="#57606A">① amr_agent 不碰位姿、不判几何、不做业务决策　② amr_behavior_manager 不直连 MQTT（否则出现第二套心跳 / 待补报）</text>
<text x="40" y="734" font-size="11.5" fill="#57606A">③ Edge 不知道 Nav2 存在：只认 resource_id / request_id / epoch / lease_ttl，不下发坐标与途经点（INV-13）</text>
<text x="40" y="760" font-size="11" fill="#888780">模块归属与 topic 命名已定案（INV-14）；2026-11-22 V0.20 定案：4 点通行控制区 + 中心点进出边沿 + 无 plan 订阅，见 traffic-gate-8-decisions-frozen.md。</text>
</svg>
