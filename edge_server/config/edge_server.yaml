edge:
  id: "edge_server_001"

warehouse:
  id: "warehouse_01"

sqlite_db:
  path: "/opt/amr/data/edge.db"

http:
  host: "0.0.0.0"
  port: 8080

websocket:
  host: "0.0.0.0"
  port: 9000
  protocol: "robotList-protocol"

mqtt:
  host: "127.0.0.1"
  port: 1883
  username: "edge_amr"
  # 凭据不写入仓库：真实值由部署环境的 AMR_MQTT_PASSWORD 注入，见 .env.example
  password: "${AMR_MQTT_PASSWORD}"
  client_id: "edge_server_001"
  tls_enable: false
  ca_file: ""
  keepalive: 12
  reconnect_interval: 5

robot:
  list_period_ms: 20000

log:
  level: "trace"